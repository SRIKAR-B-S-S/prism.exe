<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prism.exe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/prism.exe-logo.ico">
</head>
<body>

<main class="desktop">

    <!-- prism.exe text -->
    <div class="logo-txt">prism.exe</div>

    <!-- Centered Search Button -->
    <section class="search-container">
      <form id="search-form" class="search-form">
        <div class="search-wrapper">
          <span style="opacity: 0.6; margin: 0 8px;">🔍</span> <!-- Made the search icon a little less opaque -->
          <input 
            type="text" 
            id="search-input"
            class="search-input" 
            placeholder="Type a URL (e.g hackclub.com)..." 
            autofocus 
            autocomplete="off"
          />
          <button type="submit" class="xp-btn search-btn">Search</button>
        </div>
      </form>
    </section>

    <!-- Icon for Notepad here -->
     <div id="notepad-icon" class="desktop-icon">
      <img src="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/notepad.png" alt="Notepad" class="icon-img" />
      <span class="icon-label">Notepad</span>
     </div>

    <!-- Added an icon for Bookmarks Manager too -->
    <div class="desktop-icon" id="bookmarks-manager-icon">
      <img src="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/bookmarks-manager.png" class="icon-img"/>
      <span class="icon-label">Manager</span>
    </div>

    <!-- Icon for Background Settings below -->
  <div class="desktop-icon" id="settings-icon">
    <img src="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/settings.png" class="icon-img"/>
    <span class="icon-label">Settings</span>
  </div>

<div id="bookmarks-div" class="bookmarks-bg"> </div> <!-- the bookmarks will be visible here, I'll be placing it below the searchbar -->

<!-- Will be adding the Bookmarks Manager Window here-->
 <div id="bookmarksmanager-window" class="xp-window hidden">
  <div class="xp-titlebar">
    <div class="xp-titlebar-text">
      <img src="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/bookmarks-manager.png" class="xp-title-icon"> Bookmarks Manager
    </div>
    <div class="xp-titlebar-controls"><button class="xp-control-btn xp-bm-close" aria-label="Close">✕</button></div>
  </div>

 <div class="add-bookmarks">
    <form id="bm-form" class="bm-form"> <!-- shortened the `bookmarksmanager` to `bm` now-->
      <input type="text" id="bm-name-input" placeholder="Name">
      <input type="text" id="bm-url-input" placeholder="URL">
      <button type="submit" class="xp-btn">Add</button>
    </form>

    <div class="bm-list">
      <ul id="bm-list-items" class="bm-list-items"></ul>
    </div>
 </div>
</div>


  <!-- Adding the Notepad Window Here! -->
   <div id="notepad-window" class="xp-window">
        <!--Header Bar of the window-->
        <div class="xp-titlebar">
          <div class="xp-titlebar-text">
            <img src="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/notepad.png" alt="Notepad" class="xp-title-icon" />
            Untitled - Notepad
        </div>
        <div class="xp-titlebar-controls"> <!-- WinXP kind of window controls -->
          <button class="xp-control-btn xp-minimize" aria-label="Minimize" disabled>–</button>
          <button class="xp-control-btn xp-maximize" aria-label="Maximize" disabled>☐</button>
          <button class="xp-control-btn xp-close" aria-label="Close" disabled>✕</button>
        </div>
      </div>

   <!-- Menu Bar here -->
    <div class="xp-menubar"> <!-- Gave all the menu items a first letter underline -->
      <span class="menu-item"><u>F</u>ile</span>
      <span class="menu-item"><u>E</u>dit</span>
      <span class="menu-item"><u>F</u>ormat</span>
      <span class="menu-item"><u>V</u>iew</span>
      <span class="menu-item"><u>H</u>elp</span>
    </div>
  

  <!-- The main text-area of the notepad here -->
    <div class="notepad-body">
      <textarea id="xp-notepad" placeholder="Type your notes here..."></textarea>
    </div>

  <!-- The bottombar of notepad window -->
   <div class="xp-statusbar"> <!-- It's just static text and doesn't update according to the text -->
    <!-- EDIT: It's not static anymore! It updates the character count as the user types, it's some small detailing! But I'm still keeping the Ln 1, Col 1 text as they are the classic elements of the Notepad -->
    <span id="char-count">Ln 1, Col 1</span>
    <span>UTF-8</span>
   </div>
</div>

<!-- Settings Window below! -->
<div id="settings-window" class="xp-window hidden">
  <div class="xp-titlebar">
    <div class="xp-titlebar-text">
      <img src="https://raw.githubusercontent.com/SRIKAR-B-S-S/prism.exe/refs/heads/main/assets/settings.png" class="xp-title-icon"/>Settings</div>
    <div class="xp-titlebar-controls">
      <button class="xp-control-btn xp-settings-close" aria-label="Close">✕</button>
    </div>
  </div>

  <div class="settings-body">
    <p class="settings-label">Select a desktop background:</p>
    <div id="theme-options-div" class="theme-options-div">
      <!-- The theme options will be visible here(added from JS) -->
    </div>
  </div>
</div>

<!-- Added a time widget which looks like the system tray on Windows XP -->
<div class="time-widget">
  <span id="time">09:41 AM</span>
</div>

<!-- Also added an info widget which gives info about a random tech device from the Y2K era (data gets added into this span from JS)-->
<div class="info-widget">
  <span id="info">Heyy! there's some info here...</span>
</div>
  </main>
<script src="script.js"></script>
</body>
</html>
