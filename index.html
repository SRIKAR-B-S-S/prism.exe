<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>prism.exe</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" type="image/x-icon" href="/assets/prism.exe-logo.ico">
</head>
<body>

<main class="desktop">

    <!-- prism.exe text -->
    <div class="logo-txt">prism.exe</div>

    <!-- Centered Search Button -->
    <section class="search-container">
      <form id="search-form" class="search-form">
        <div class="search-wrapper">
          <span style="opacity: 0.6; margin: 0 8px;">🔍</span> <!-- Made the search icon a little less opaque -->
          <input 
            type="text" 
            id="search-input"
            class="search-input" 
            placeholder="Type a URL (e.g hackclub.com)..." 
            autofocus 
            autocomplete="off"
          />
          <button type="submit" class="xp-btn search-btn">Search</button>
        </div>
      </form>
    </section>

  </main>

</body>
</html>
<script src="script.js"></script>
